name: GN866 AC build

on:
  push:
    branches:
      - master
      - gn866-ac-build
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y build-essential gcc g++ gcc-multilib g++-multilib make bc bison flex rsync unzip zip xz-utils bzip2 gzip file cpio gettext pkg-config python3 libncurses5-dev libc6-i386 lib32z1 libstdc++6:i386 zlib1g:i386 libc6-dev-i386

      - name: Configure GN866 AC
        run: |
          chmod +x scripts/build-gn866-ac.sh
          ./scripts/build-gn866-ac.sh
        env:
          JOBS: "2"

      - name: Collect images
        if: always()
        run: |
          mkdir -p artifacts
          find rtl819x/target/image -maxdepth 1 -type f -exec cp -v {} artifacts/ \; 2>/dev/null || true
          find rtl819x/image -maxdepth 1 -type f -exec cp -v {} artifacts/ \; 2>/dev/null || true
          ls -lh artifacts || true

      - name: Upload GN866 AC firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GN866-AC-firmware
          path: artifacts/
          if-no-files-found: warn
